{% extends 'base.html' %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<section class="panel form-panel">
  <form method="post" class="form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>Current password<input type="password" name="current_password" required></label>
    <label>New password<input type="password" name="new_password" minlength="10" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" minlength="10" required></label>
    <div class="form-actions"><a class="btn" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn primary">Change password</button></div>
  </form>
</section>
{% endblock %}
