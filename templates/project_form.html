{% extends 'base.html' %}{% block page_title %}{{ 'Edit project' if row else 'New project' }}{% endblock %}
{% block content %}<section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
<label>Project name<input name="name" value="{{ row.name if row else '' }}" required></label>
<label>Client<select name="client_id"><option value="">No client</option>{% for c in clients %}<option value="{{ c.id }}" {{ 'selected' if row and row.client_id==c.id else '' }}>{{ c.name }}</option>{% endfor %}</select></label>
<label>Budget (KSh)<input type="number" step="0.01" name="budget" value="{{ row.budget if row else 0 }}"></label>
<label>Status<select name="status">{% for s in ['planning','active','on_hold','completed','cancelled'] %}<option value="{{s}}" {{ 'selected' if row and row.status==s else '' }}>{{ s|replace('_',' ') }}</option>{% endfor %}</select></label>
<label>Start date<input type="date" name="start_date" value="{{ row.start_date if row else '' }}"></label>
<label>Due date<input type="date" name="due_date" value="{{ row.due_date if row else '' }}"></label>
<label class="full">Description<textarea name="description" rows="5">{{ row.description if row else '' }}</textarea></label>
<div class="full form-actions"><a class="btn" href="{{ url_for('projects') }}">Cancel</a><button class="btn primary">Save project</button></div>
</form></section>{% endblock %}
