{% extends 'base.html' %}{% block page_title %}New invoice{% endblock %}
{% block content %}<section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
<input type="hidden" name="request_token" value="{{ request_token }}">
<label>Invoice number<input name="invoice_no" maxlength="64" placeholder="Assigned automatically if left blank"></label>
<label>Client<select name="client_id" required><option value="">Choose client</option>{% for c in clients %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></label>
<label>Amount (KSh)<input type="number" step="0.01" min="0.01" max="1000000000" name="amount" required></label>
<label>Due date<input type="date" name="due_date"></label>
<label class="full">Description<textarea name="description" rows="5"></textarea></label>
<div class="full form-actions"><a class="btn" href="{{ url_for('invoices') }}">Cancel</a><button class="btn primary">Create invoice</button></div>
</form></section>{% endblock %}
