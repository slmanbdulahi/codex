{% extends 'base.html' %}{% block page_title %}Record payment{% endblock %}
{% block content %}<div class="two-col"><section class="panel"><h2>{{ inv.invoice_no }}</h2><div class="summary"><p><span>Invoice total</span><strong>KSh {{ '{:,.0f}'.format(inv.amount) }}</strong></p><p><span>Already paid</span><strong>KSh {{ '{:,.0f}'.format(paid) }}</strong></p><p><span>Balance</span><strong>KSh {{ '{:,.0f}'.format(balance) }}</strong></p></div></section>
<section class="panel form-panel"><form method="post" class="form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label>Amount<input type="number" step="0.01" min="0.01" max="{{ balance if balance else inv.amount }}" name="amount" value="{{ balance }}" required></label><label>Method<select name="method"><option>M-Pesa</option><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Other</option></select></label><label>Reference<input name="reference" placeholder="Transaction/reference ID"></label><label>Payment date<input type="date" name="paid_at" required></label><button class="btn primary">Save payment</button></form></section></div>{% endblock %}
