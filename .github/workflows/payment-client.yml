name: Payment client checks

on:
  pull_request:
    branches: [codex/create-api-service-functions]
  push:
    branches: [codex/create-api-service-functions]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Check that the bundle uses no privileged client configuration
        run: |
          if grep -rqlE 'REACT_APP_[A-Z_]*KEY|process\.env|Authorization.*Bearer' dist/; then
            echo "The browser bundle contains a privileged configuration reference"
            exit 1
          fi
